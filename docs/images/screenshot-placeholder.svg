  <text x="366" y="216" fill="#8893a6" font-family="Segoe UI, sans-serif" font-size="14">本地离线 OCR</text>
  <rect x="990" y="177" width="136" height="32" rx="16" fill="#222b39" stroke="#333e50"/>
  <text x="1058" y="198" text-anchor="middle" fill="#70a8ff" font-family="Segoe UI, sans-serif" font-size="13">已复制</text>
  <rect x="284" y="248" width="252" height="454" rx="20" fill="#1a202b" stroke="#2d3645"/>
  <rect x="308" y="272" width="204" height="316" rx="12" fill="#0e131c" stroke="#303a49"/>
  <path d="M342 410h136M342 448h108M342 486h124" stroke="#536176" stroke-width="10" stroke-linecap="round"/>
  <rect x="556" y="248" width="600" height="454" rx="20" fill="#1a202b" stroke="#2d3645"/>
  <text x="586" y="289" fill="#8893a6" font-family="Segoe UI, sans-serif" font-size="15">识别结果</text>
  <path d="M594 346h516M594 390h448M594 434h500M594 478h382M594 522h492M594 566h420" stroke="#6d7a8e" stroke-width="14" stroke-linecap="round"/>
  <rect x="284" y="722" width="872" height="1" fill="#303949"/>
  <text x="308" y="762" fill="#738095" font-family="Segoe UI, sans-serif" font-size="14">全程本地处理 · 不上传云端</text>
  <text x="1060" y="738" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600">Ctrl + Shift + X</text>
</svg>