<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">SnapOCR screenshot placeholder</title>
  <desc id="desc">A placeholder for the SnapOCR spotlight-style desktop panel.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#090d14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74adff"/>
      <stop offset="1" stop-color="#2f70e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#background)"/>
  <rect x="260" y="132" width="920" height="620" rx="36" fill="#151b26" stroke="#313a49" filter="url(#shadow)"/>
  <rect x="284" y="156" width="872" height="72" rx="24" fill="#1c2330"/>
  <rect x="308" y="176" width="40" height="40" rx="13" fill="url(#accent)"/>
