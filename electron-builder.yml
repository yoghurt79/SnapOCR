appId: com.snapocr.app
productName: SnapOCR
copyright: Copyright (c) 2026 SnapOCR contributors

directories:
  output: release/${version}
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true
asarUnpack:
  - out/renderer/ocr/**
  - out/renderer/tessdata/**
compression: maximum

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SnapOCR
  deleteAppDataOnUninstall: false